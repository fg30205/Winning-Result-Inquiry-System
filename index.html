<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽獎結果查詢</title>
<meta name="description" content="輸入角色名稱，查詢抽獎結果。">
<style>
:root{
  --bg:#0b0d10;
  --panel:#12161b;
  --panel-2:#171c22;
  --line:#2a3038;
  --text:#f3f0e8;
  --muted:#9299a3;
  --gold:#c7a45a;
  --gold-soft:#e0c887;
  --danger:#e38585;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:var(--bg);
  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    system-ui,
    -apple-system,
    sans-serif;
  letter-spacing:.01em;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size:28px 28px;
}

.site{
  width:min(980px, calc(100% - 36px));
  margin:0 auto;
  padding:56px 0 48px;
  position:relative;
}

.topline{
  height:2px;
  width:64px;
  background:var(--gold);
  margin-bottom:22px;
}

header{
  border-bottom:1px solid var(--line);
  padding-bottom:30px;
  margin-bottom:34px;
}

.eyebrow{
  color:var(--gold-soft);
  font-size:12px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:10px;
}

h1{
  margin:0;
  font-family:Georgia, "Times New Roman", "Noto Serif TC", serif;
  font-size:clamp(32px, 6vw, 54px);
  font-weight:700;
  line-height:1.08;
}

.subtitle{
  color:var(--muted);
  font-size:15px;
  line-height:1.8;
  margin-top:14px;
  max-width:660px;
}

.search-section{
  background:var(--panel);
  border:1px solid var(--line);
}

.search-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  padding:22px 24px 16px;
  border-bottom:1px solid var(--line);
}

.search-head h2{
  margin:0;
  font-size:15px;
  font-weight:700;
  letter-spacing:.08em;
}

.status{
  color:var(--muted);
  font-size:12px;
}

.search-body{
  padding:22px 24px 24px;
}

.search-row{
  display:flex;
  gap:10px;
}

.input-wrap{
  flex:1;
  position:relative;
}

input[type="search"]{
  width:100%;
  height:52px;
  border:1px solid #353d47;
  background:#0e1216;
  color:var(--text);
  padding:0 48px 0 16px;
  font-size:17px;
  border-radius:0;
  outline:none;
  transition:border-color .15s ease, background .15s ease;
}

input[type="search"]:focus{
  border-color:var(--gold);
  background:#10151a;
}

input[type="search"]::placeholder{color:#626a74}

.clear-btn{
  position:absolute;
  right:0;
  top:0;
  width:48px;
  height:52px;
  border:0;
  background:transparent;
  color:#7f8790;
  font-size:21px;
  cursor:pointer;
}

.clear-btn:hover{color:var(--text)}

.helper{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
  margin-top:10px;
}

.results-area{
  margin-top:26px;
}

.result-note{
  color:var(--muted);
  font-size:13px;
  margin-bottom:10px;
}

.name-list{
  border-top:1px solid var(--line);
}

.name-row{
  width:100%;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px 2px;
  background:transparent;
  color:var(--text);
  border:0;
  border-bottom:1px solid var(--line);
  text-align:left;
  cursor:pointer;
  font-size:16px;
}

.name-row:hover .name-text{color:var(--gold-soft)}

.name-meta{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.empty{
  padding:30px 0 12px;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.no-result{
  text-align:center;
}

.no-result-image{
  display:block;
  width:min(240px, 68vw);
  height:auto;
  margin:18px auto 0;
  object-fit:contain;
}

.error{color:var(--danger)}

.player-section{
  margin-top:38px;
  border-top:2px solid var(--gold);
  padding-top:24px;
}

.player-titlebar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}

.player-name{
  margin:0;
  font-size:26px;
  font-family:Georgia, "Times New Roman", "Noto Serif TC", serif;
}

.player-count{
  color:var(--muted);
  font-size:13px;
}

.prize-table{
  width:100%;
  border-collapse:collapse;
  border:1px solid var(--line);
  background:var(--panel);
}

.prize-table th,
.prize-table td{
  padding:15px 16px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}

.prize-table th{
  background:var(--panel-2);
  color:#abb2bb;
  text-align:left;
  font-size:12px;
  letter-spacing:.08em;
  font-weight:700;
}

.prize-table td{
  font-size:14px;
  line-height:1.6;
}

.prize-table tr:last-child td{border-bottom:0}

.prize-col{width:58%}
.date-col{width:19%; white-space:nowrap}
.order-col{width:23%; white-space:nowrap}

footer{
  border-top:1px solid var(--line);
  margin-top:34px;
  padding-top:18px;
  color:#626a74;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}

@media(max-width:680px){
  .site{
    width:min(100% - 24px, 980px);
    padding-top:30px;
  }

  header{
    padding-bottom:22px;
    margin-bottom:22px;
  }

  .search-head{
    align-items:flex-start;
    flex-direction:column;
    gap:5px;
    padding:18px 16px 13px;
  }

  .search-body{padding:18px 16px}

  input[type="search"]{font-size:16px}

  .player-titlebar{
    align-items:flex-start;
    flex-direction:column;
    gap:5px;
  }

  .prize-table,
  .prize-table tbody,
  .prize-table tr,
  .prize-table td{
    display:block;
    width:100%;
  }

  .prize-table thead{display:none}

  .prize-table tr{
    border-bottom:1px solid var(--line);
    padding:13px 14px;
  }

  .prize-table tr:last-child{border-bottom:0}

  .prize-table td{
    padding:4px 0;
    border:0;
  }

  .prize-table td::before{
    display:block;
    color:#717984;
    font-size:11px;
    letter-spacing:.08em;
    margin-bottom:2px;
  }

  .prize-table td:nth-child(1)::before{content:"獎項"}
  .prize-table td:nth-child(2)::before{content:"日期"}
  .prize-table td:nth-child(3)::before{content:"當日次序"}

  footer{margin-top:24px}
}
</style>
</head>
<body>
<main class="site">
  <header>
    <div class="topline"></div>
    <div class="eyebrow">DRAW RESULT INQUIRY</div>
    <h1>抽獎結果查詢</h1>
    <div class="subtitle">
      輸入部分角色名稱即可搜尋。若有多個相近名稱，請從結果中選擇自己的角色。
    </div>
  </header>

  <section class="search-section">
    <div class="search-head">
      <h2>角色名稱查詢</h2>
      <div class="status" id="dataStatus">讀取名單中</div>
    </div>

    <div class="search-body">
      <div class="input-wrap">
        <input id="searchInput" type="search" placeholder="輸入角色名稱" autocomplete="off" spellcheck="false">
        <button id="clearButton" class="clear-btn" type="button" aria-label="清除搜尋">×</button>
      </div>
      <div class="helper">支援部分文字搜尋，例如輸入「番茄」會列出所有名稱中包含「番茄」的角色。</div>

      <div class="results-area" id="resultsArea">
        <div class="empty">請輸入角色名稱開始查詢。</div>
      </div>

      <div id="playerArea"></div>
    </div>
  </section>

  <footer>
    <span>Draw Result Inquiry System</span>
    <span>資料以最新公布名單為準</span>
  </footer>
</main>

<script>
let records = [];
let names = [];

const searchInput = document.getElementById('searchInput');
const resultsArea = document.getElementById('resultsArea');
const playerArea = document.getElementById('playerArea');
const dataStatus = document.getElementById('dataStatus');
const clearButton = document.getElementById('clearButton');

function normalize(text){
  return String(text || '').trim().replace(/\s+/g, ' ');
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[char]));
}

function parseData(data){
  if(!Array.isArray(data)) return [];
  return data
    .filter(item => item && item.award && item.date && item.winner)
    .map(item => ({
      prize: String(item.award).trim(),
      date: String(item.date).trim(),
      winner: String(item.winner).trim()
    }));
}

async function loadData(){
  try{
    const response = await fetch(`winner-data.json?v=${Date.now()}`, {cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    records = parseData(data);

    // 當日獎項次序：同一獎項、同一日期內，依 winner 在 JSON 中的出現順序計算。
    // 例如 0924 名單中的第 16 位 winner，就顯示「第 16 項」。
    const positionMap = {};
    records.forEach(record => {
      const key = record.prize + "\u0000" + record.date;
      positionMap[key] = (positionMap[key] || 0) + 1;
      record.order = positionMap[key];
    });

    names = [...new Set(records.map(record => record.winner))]
      .sort((a,b) => a.localeCompare(b, 'zh-Hant'));

    if(records.length){
      dataStatus.textContent = `${names.length} 位角色 / ${records.length} 筆紀錄`;
      resultsArea.innerHTML = '<div class="empty">請輸入角色名稱開始查詢。</div>';
    }else{
      dataStatus.textContent = '目前無資料';
      resultsArea.innerHTML = '<div class="empty">目前名單沒有可查詢資料。</div>';
    }
  }catch(error){
    dataStatus.textContent = '名單讀取失敗';
    resultsArea.innerHTML =
      '<div class="empty error">目前無法載入名單，請稍後再試。</div>';
  }
}

function renderSearch(){
  const keyword = normalize(searchInput.value);
  playerArea.innerHTML = '';

  if(!keyword){
    resultsArea.innerHTML = '<div class="empty">請輸入角色名稱開始查詢。</div>';
    return;
  }

    <div class="name-list">
      ${matches.map((name, index) => {
        const count = records.filter(record => record.winner === name).length;
        return `
          <button class="name-row" type="button" data-index="${index}">
            <span class="name-text">${escapeHtml(name)}</span>
            <span class="name-meta">${count} 筆紀錄</span>
          </button>`;
      }).join('')}
    </div>
  `;

  resultsArea.querySelectorAll('.name-row').forEach((button, index) => {
    button.addEventListener('click', () => showPlayer(matches[index]));
  });
}

function showPlayer(name){
  const prizes = records
    .filter(record => record.winner === name)
    .sort((a,b) => {
      const dateCompare = String(a.date).localeCompare(String(b.date));
      return dateCompare || a.order - b.order;
    });

  playerArea.innerHTML = `
    <section class="player-section">
      <div class="player-titlebar">
        <h2 class="player-name">${escapeHtml(name)}</h2>
        <div class="player-count">共 ${prizes.length} 筆中獎紀錄</div>
      </div>

      <table class="prize-table">
        <thead>
          <tr>
            <th class="prize-col">獎項名稱</th>
            <th class="date-col">日期</th>
            <th class="order-col">當日獎項次序</th>
          </tr>
        </thead>
        <tbody>
          ${prizes.map(item => `
            <tr>
              <td>${escapeHtml(item.prize)}</td>
              <td>${escapeHtml(item.date)}</td>
              <td>第 ${item.order} 項</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>
  `;

  playerArea.scrollIntoView({behavior:'smooth', block:'nearest'});
}

searchInput.addEventListener('input', renderSearch);

clearButton.addEventListener('click', () => {
  searchInput.value = '';
  playerArea.innerHTML = '';
  resultsArea.innerHTML = '<div class="empty">請輸入角色名稱開始查詢。</div>';
  searchInput.focus();
});

loadData();
</script>
