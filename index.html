<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遊戲中獎名單查詢</title><style>:root{--bg:#0b1120;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--accent:#60a5fa;--border:#334155}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#0b1120;color:var(--text);min-height:100vh}.wrap{width:min(900px,92%);margin:auto;padding:36px 0}header{text-align:center;margin-bottom:25px}h1{margin:0 0 8px}.sub,.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px}.search{position:relative}input{width:100%;padding:14px 45px 14px 14px;border-radius:12px;border:1px solid var(--border);background:#0f172a;color:white;font-size:18px}#clear{position:absolute;right:8px;top:7px;border:0;background:transparent;color:var(--muted);font-size:24px}.hint{font-size:14px;color:var(--muted);margin-top:9px}.results{margin-top:18px}.name{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:11px;border:1px solid var(--border);background:#172033;color:white;font-size:16px}.badge{float:right;background:#334155;padding:3px 8px;border-radius:999px;font-size:12px}.selected{border-top:1px solid var(--border);margin-top:20px;padding-top:18px}.prize{background:#172033;border:1px solid var(--border);border-radius:14px;padding:15px;margin:10px 0}.meta{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.meta span{background:#273449;padding:5px 9px;border-radius:8px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:28px 5px}.error{color:#fda4af}footer{text-align:center;color:#64748b;font-size:13px;margin-top:22px}</style></head><body><div class="wrap"><header><div style="font-size:40px">🎁</div><h1>遊戲中獎名單查詢</h1><div class="sub">輸入部分遊戲暱稱，選擇自己的角色查看中獎紀錄</div></header><main class="card"><b>搜尋玩家名稱</b><div class="search"><input id="q" placeholder="例如：叮噹" autocomplete="off"><button id="clear">×</button></div><div class="hint">輸入部分名稱即可搜尋。</div><div id="results" class="results"><div class="empty">正在載入最新名單…</div></div><div id="selected"></div></main><footer>中獎名單查詢</footer></div><script>let records=[],names=[];const $=id=>document.getElementById(id),norm=s=>s.trim().replace(/\s+/g,' '),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function parse(t){let o=[],p=null,c={};for(const raw of t.replace(/\r/g,'').split('\n')){const l=norm(raw);if(!l)continue;const m=l.match(/^(\d{4,8})\s*(.*)$/);if(m&&m[2].trim()){if(!p)p='未分類獎項';const d=m[1];c[d]=(c[d]||0)+1;const ord=c[d];m[2].split('/').map(norm).filter(Boolean).forEach(w=>o.push({prize:p,date:d,order:ord,winner:w}))}else p=l}return o}async function load(){try{const r=await fetch('winner-list.txt?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;records=parse(await r.text());names=[...new Set(records.map(x=>x.winner))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));$('results').innerHTML=records.length?'<div class="empty">請輸入玩家名稱開始搜尋。</div>':'<div class="empty">目前沒有資料。</div>'}catch(e){$('results').innerHTML='<div class="empty error">無法載入 winner-list.txt。</div>'}}function search(){const k=norm($('q').value);$('selected').innerHTML='';if(!k){$('results').innerHTML='<div class="empty">請輸入玩家名稱開始搜尋。</div>';return}const ms=names.filter(n=>n.includes(k));if(!ms.length){$('results').innerHTML='<div class="empty">找不到符合的玩家名稱。</div>';return}$('results').innerHTML='<div class="muted">找到 '+ms.length+' 位符合玩家：</div>'+ms.map((n,i)=>'<button class="name" data-i="'+i+'">'+esc(n)+'<span class="badge">中獎 '+records.filter(r=>r.winner===n).length+' 次</span></button>').join('');document.querySelectorAll('.name').forEach((b,i)=>b.onclick=()=>show(ms[i]))}function show(n){const a=records.filter(r=>r.winner===n).sort((x,y)=>String(x.date).localeCompare(String(y.date))||x.order-y.order);$('selected').innerHTML='<section class="selected"><h2>🎉 '+esc(n)+'</h2>'+a.map(r=>'<div class="prize"><b>'+esc(r.prize)+'</b><div class="meta"><span>📅 日期：'+esc(r.date)+'</span><span>🏆 當日第 '+r.order+' 項獎項</span></div></div>').join('')+'</section>'}$('q').addEventListener('input',search);$('clear').onclick=()=>{$('q').value='';search()};load();</script></body></html>
